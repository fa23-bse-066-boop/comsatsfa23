version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: dcms-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: dcms
      POSTGRES_USER: dcms_app
      POSTGRES_PASSWORD: dcms_password_change_me
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dcms_app -d dcms"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dcms-network

  mongodb:
    image: mongo:7.0
    container_name: dcms-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: dcms
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - dcms-network

  # Optional: Mongo Express (UI to view database)
  mongo-express:
    image: mongo-express:latest
    container_name: dcms-mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password
      ME_CONFIG_MONGODB_URL: mongodb://admin:password@mongodb:27017/
      ME_CONFIG_BASICAUTH: false
    depends_on:
      - mongodb
    networks:
      - dcms-network

volumes:
  postgres_data:
  mongodb_data:
  mongodb_config:

networks:
  dcms-network:
    driver: bridge
